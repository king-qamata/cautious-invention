<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="1080" height="380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .navy { fill:#1B2A4A; }
      .red { fill:#D42A3C; }
    </style>
  </defs>

  <!-- Heartbeat pulse: left leg (blue), right leg (red), meeting at a heart+cross -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blue left pulse: flat -> up -> down to heart -->
    <path d="M 40 210 L 190 210 L 300 60 L 350 175"
          stroke="#1E7FC2" stroke-width="34"/>
    <!-- Red right pulse: from heart -> up -> down -> flat with rounded end -->
    <path d="M 460 175 L 505 60 L 615 210 L 830 210"
          stroke="#D42A3C" stroke-width="34"/>
    <circle cx="852" cy="210" r="20" fill="#D42A3C"/>
  </g>

  <!-- Heart with cross, centered where the two pulse legs meet -->
  <g transform="translate(405,150)">
    <path d="M0,55
             C -55,10 -50,-45 -10,-45
             C 5,-45 10,-35 0,-25
             C -10,-35 -5,-45 10,-45
             C 50,-45 55,10 0,55 Z"
          fill="none" stroke="#D42A3C" stroke-width="9"/>
    <!-- medical cross -->
    <rect x="-9" y="-22" width="18" height="52" fill="#D42A3C"/>
    <rect x="-22" y="-9" width="52" height="18" fill="#D42A3C"/>
    <rect x="-9" y="-22" width="18" height="52" fill="#FFFFFF" transform="scale(0.001)"/>
  </g>
  <!-- white gap so the cross reads as a cutout against the heart, matching original -->
  <g transform="translate(405,150)">
    <rect x="-8" y="-20" width="16" height="46" fill="#FFFFFF"/>
    <rect x="-20" y="-8" width="46" height="16" fill="#FFFFFF"/>
    <rect x="-7" y="-19" width="14" height="44" fill="#D42A3C"/>
    <rect x="-19" y="-7" width="44" height="14" fill="#D42A3C"/>
  </g>

  <!-- Wordmark -->
  <text x="40" y="330" font-family="Verdana, Arial, sans-serif" font-size="72" font-weight="700">
    <tspan class="navy">Mind</tspan><tspan class="red">set</tspan>
  </text>
  <text x="565" y="330" font-family="Verdana, Arial, sans-serif" font-size="66" font-weight="700">
    <tspan class="navy">Health</tspan><tspan class="red">care</tspan>
  </text>
</svg>
